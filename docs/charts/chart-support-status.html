<body>
<figure class="fig">
  <h1>How much of the fleet runs supported software?</h1>
  <p class="sub">Every tracked portal in the latest weekly crawl, by support status.</p>
  <hr>
  <div class="plot" id="plot"></div>
  <figcaption>Source: dathere/pose-ckanext-metadata weekly crawl · n = 733 portals</figcaption>
</figure>
<script>
Plotly.newPlot("plot", [{"type": "pie", "hole": 0.62, "sort": false, "direction": "clockwise", "labels": ["Newest patch of a supported branch \u2014 55", "Supported branch, behind on patches \u2014 158", "End-of-life branch \u2014 268", "No version reported \u2014 252"], "values": [55, 158, 268, 252], "marker": {"colors": ["#198038", "#42be65", "#da1e28", "#8d8d8d"], "line": {"color": "#ffffff", "width": 2}}, "textinfo": "percent", "textposition": "inside", "insidetextorientation": "horizontal", "textfont": {"family": "'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif", "size": 12.5, "color": ["#ffffff", "#161616", "#ffffff", "#ffffff"]}, "hovertemplate": "%{label}<br>%{percent} of the fleet<extra></extra>"}], {"font": {"family": "'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif", "size": 12.5, "color": "#525252"}, "paper_bgcolor": "#ffffff", "plot_bgcolor": "#ffffff", "margin": {"l": 4, "r": 4, "t": 6, "b": 6}, "hoverlabel": {"bgcolor": "#ffffff", "bordercolor": "#e0e0e0", "font": {"family": "'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif", "size": 12.5, "color": "#161616"}, "align": "left"}, "showlegend": true, "legend": {"orientation": "v", "x": 1.0, "xanchor": "left", "y": 0.5, "font": {"family": "'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif", "size": 12, "color": "#525252"}, "itemsizing": "constant"}, "annotations": [{"text": "<span style='font-size:26px;color:#161616'>733</span><br><span style='font-size:12px;color:#6f6f6f'>portals</span>", "showarrow": false, "x": 0.5, "y": 0.5, "xref": "paper", "yref": "paper", "font": {"family": "'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif"}}]}, {displayModeBar: false, responsive: true});
