<text x="660.0" y="36" font-size="18" text-anchor="middle" font-weight="bold" fill="#1e1e1e">CKAN Sites Pipeline</text>
<text x="660.0" y="59" font-size="18" text-anchor="middle" font-weight="normal" fill="#1e1e1e">.github/workflows/ckan_site_datapump.yml</text>
<text x="40" y="48" font-size="14" text-anchor="start" font-weight="normal" fill="#5c5f66">Trigger</text>
<text x="40" y="66" font-size="14" text-anchor="start" font-weight="normal" fill="#5c5f66">Sundays 03:00 UTC</text>
<text x="40" y="84" font-size="14" text-anchor="start" font-weight="normal" fill="#5c5f66">or manual dispatch</text>
<text x="940" y="38" font-size="14" text-anchor="start" font-weight="normal" fill="#5c5f66">blue   pipeline step</text>
<text x="940" y="56" font-size="14" text-anchor="start" font-weight="normal" fill="#5c5f66">yellow  file</text>
<text x="940" y="74" font-size="14" text-anchor="start" font-weight="normal" fill="#5c5f66">green   external system</text>
<text x="940" y="92" font-size="14" text-anchor="start" font-weight="normal" fill="#5c5f66">red    published output</text>
<text x="220.0" y="145" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">Catalogued CKAN instances</text>
<text x="220.0" y="166" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">733 live portals worldwide</text>
<text x="660.0" y="145" font-size="16" text-anchor="middle" font-weight="bold" fill="#1e1e1e">Step 1  1getSitesURL.py</text>
<text x="660.0" y="166" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">read site packages from catalog</text>
<text x="1080.0" y="145" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">CKAN Ecosystem Catalog</text>
<text x="1080.0" y="166" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">ecosystem.ckan.org</text>
<text x="660.0" y="255" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">site_urls.csv</text>
<text x="660.0" y="343" font-size="16" text-anchor="middle" font-weight="bold" fill="#1e1e1e">Step 2  2CKANActionAPI.py</text>
<text x="660.0" y="364" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">status_show, package_search, group_list</text>
<text x="660.0" y="384" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">10 workers, 15s timeout, 3 retries</text>
<text x="660.0" y="463" font-size="13" text-anchor="middle" font-weight="normal" fill="#1e1e1e">ckan_stats.csv</text>
<text x="660.0" y="480" font-size="13" text-anchor="middle" font-weight="normal" fill="#1e1e1e">tstamp, name, url, datasets, groups, orgs,</text>
<text x="660.0" y="496" font-size="13" text-anchor="middle" font-weight="normal" fill="#1e1e1e">ckan_version, extensions</text>
<text x="660.0" y="575" font-size="16" text-anchor="middle" font-weight="bold" fill="#1e1e1e">Step 3  3updateSitesCatalog.py</text>
<text x="660.0" y="596" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">package_patch on each site package</text>
<text x="660.0" y="681" font-size="16" text-anchor="middle" font-weight="bold" fill="#1e1e1e">Step 4  datapump.py</text>
<text x="660.0" y="702" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">merge history, push to datastore</text>
<text x="1080.0" y="681" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">Datastore resource</text>
<text x="1080.0" y="702" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">CKAN Sites Dynamic Metadata</text>
<text x="660.0" y="794" font-size="16" text-anchor="middle" font-weight="bold" fill="#1e1e1e">Step 5  derive_csvs.sh   (qsv)</text>
<text x="660.0" y="815" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">luau enrich, explode, sqlp windows,</text>
<text x="660.0" y="835" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">pivotp series, cat rows stacking</text>
<text x="220.0" y="784" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">sites-history/*.csv</text>
<text x="220.0" y="805" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">43 archived crawls</text>
<text x="220.0" y="825" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">2025-07-18 .. 2026-08-23</text>
<text x="220.0" y="846" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">30,426 rows</text>
<text x="660.0" y="932" font-size="13" text-anchor="middle" font-weight="normal" fill="#1e1e1e">derived/  (8 CSVs)</text>
<text x="660.0" y="948" font-size="13" text-anchor="middle" font-weight="normal" fill="#1e1e1e">ckan_instances_clean.csv</text>
<text x="660.0" y="965" font-size="13" text-anchor="middle" font-weight="normal" fill="#1e1e1e">ckan_extension_ranking.csv</text>
<text x="660.0" y="981" font-size="13" text-anchor="middle" font-weight="normal" fill="#1e1e1e">ckan_weekly_long.csv</text>
<text x="660.0" y="998" font-size="13" text-anchor="middle" font-weight="normal" fill="#1e1e1e">ckan_version_changes.csv</text>
<text x="660.0" y="1015" font-size="13" text-anchor="middle" font-weight="normal" fill="#1e1e1e">ckan_extension_changes.csv</text>
<text x="660.0" y="1031" font-size="13" text-anchor="middle" font-weight="normal" fill="#1e1e1e">ckan_extension_trends.csv</text>
<text x="660.0" y="1048" font-size="13" text-anchor="middle" font-weight="normal" fill="#1e1e1e">ckan_extension_series.csv</text>
<text x="660.0" y="1065" font-size="13" text-anchor="middle" font-weight="normal" fill="#1e1e1e">ckan_extension_cohort_series.csv</text>
<text x="220.0" y="983" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">GitHub artifacts</text>
<text x="220.0" y="1004" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">sites-metadata-csv-files, 30 days</text>
<text x="660.0" y="1151" font-size="16" text-anchor="middle" font-weight="bold" fill="#1e1e1e">Step 6  upload_derived.py</text>
<text x="660.0" y="1172" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">resource_update, else resource_create</text>
<text x="1080.0" y="1151" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">8 CSV resources on</text>
<text x="1080.0" y="1172" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">ckan-sites-metadata</text>
<text x="660.0" y="1255" font-size="16" text-anchor="middle" font-weight="bold" fill="#1e1e1e">Step 7  patch_instance_counts.py</text>
<text x="660.0" y="1276" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">plugins -> packages, distinct instances</text>
<text x="660.0" y="1296" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">package_patch instances_count</text>
<text x="1080.0" y="1255" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">instances_count on</text>
<text x="1080.0" y="1276" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">extension packages</text>
<text x="1080.0" y="1296" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">336 of 1,480 observed</text>
<text x="660.0" y="1379" font-size="16" text-anchor="middle" font-weight="bold" fill="#1e1e1e">Step 8  git-auto-commit-action</text>
<text x="660.0" y="1400" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">commit the archived crawl</text>
<text x="1080.0" y="1379" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">sites-history/&lt;crawl-date>.csv</text>
<text x="1080.0" y="1400" font-size="16" text-anchor="middle" font-weight="normal" fill="#1e1e1e">committed to main</text>
</svg>