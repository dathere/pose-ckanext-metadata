name: Datapump CKAN Extensions Timeseries Metadata
on:
  schedule:
    # Runs every Sunday at 2:00 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    # Allows manual triggering from GitHub UI

# Step 8 commits the crawl archive, the same as the sites workflow does.
permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GH_METADATA_TOKEN }}
  CKAN_API_KEY: ${{ secrets.CKAN_API_KEY }}

jobs:
  update-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Install qsv
      run: |
        QSV_VERSION=22.0.1
        curl -sSLo "$RUNNER_TEMP/qsv.zip" \
          "https://github.com/dathere/qsv/releases/download/$QSV_VERSION/qsv-$QSV_VERSION-x86_64-unknown-linux-gnu.zip"
        unzip -q -o "$RUNNER_TEMP/qsv.zip" -d "$RUNNER_TEMP/qsv"
        sudo install "$RUNNER_TEMP/qsv/qsv" /usr/local/bin/qsv
        qsv --version

    - name: Step 1 - Extract GitHub URLs from CKAN
      run: |
        echo "=== STEP 1: Extracting GitHub URLs from CKAN ==="
        cd extensions-workflow
        python 1getURL.py
        echo "✓ URL extraction completed"

        # This step returning nothing is how the 2026-09-06 run failed. The
        # floor compares against the newest archived crawl, so a half-empty
        # discovery is caught rather than propagated.
        ../ecosystem/check_crawl.sh url_list.csv 'catalog_url,github_url' ../extensions-history
    
    - name: Step 2 - Fetch Dynamic Metadata from GitHub
      run: |
        echo "=== STEP 2: Fetching dynamic metadata from GitHub ==="
        cd extensions-workflow
        python 2refresh.py
        echo "✓ Metadata extraction completed"

        ../ecosystem/check_crawl.sh dynamic_metadata_update.csv \
          'tstamp,repository_name,url,forks_count,total_releases,latest_release,release_date,stars,open_issues,contributors_count,discussions' \
          ../extensions-history
    
    # GraphQL rather than more REST: one query carries 25 repositories with
    # their pushes, branches, forks and packaging files for a cost of 1 point,
    # so the whole catalogue costs ~120 of a 5,000/hour budget.
    - name: Step 2b - Collect branch, fork and entry-point data
      continue-on-error: true
      run: |
        echo "=== STEP 2b: Collecting GitHub activity and entry points ==="
        cd extensions-workflow
        python 4github_activity.py url_list.csv \
          -o github_activity.csv --entry-points entry_points.csv

        mkdir -p ../extensions-activity
        cp github_activity.csv entry_points.csv ../extensions-activity/

    - name: Step 3 - Update CKAN Catalog with Metadata
      continue-on-error: true
      run: |
        echo "=== STEP 3: Updating CKAN catalog with metadata ==="
        cd extensions-workflow
        python 3updateCatalog.py
        echo "✓ CKAN catalog update completed"

    - name: Step 4 - Append Time-Series Data to CKAN
      run: |
        echo "=== STEP 4: Appending time-series data to CKAN ==="
        cd extensions-workflow

        # Guard: ensure the metadata CSV has data before appending
        if [ ! -f "dynamic_metadata_update.csv" ]; then
          echo "✗ dynamic_metadata_update.csv not found, skipping append"
          exit 1
        fi
        ROW_COUNT=$(wc -l < dynamic_metadata_update.csv)
        if [ "$ROW_COUNT" -lt 2 ]; then
          echo "✗ dynamic_metadata_update.csv has no data rows (only $ROW_COUNT lines), skipping append"
          exit 1
        fi
        echo "✓ CSV validated: $ROW_COUNT lines"

        python timeseries_append.py dynamic_metadata_update.csv
        echo "✓ Time-series data append completed"
    
    # Deliberately NOT continue-on-error, for the same reason as the sites
    # pipeline: qsv cat rows stacks the archive positionally, so a malformed
    # file does not degrade the weekly build, it kills it.
    - name: Step 5 - Archive crawl
      if: ${{ !cancelled() }}
      run: |
        echo "=== STEP 5: Archiving crawl ==="
        cd extensions-workflow

        ../ecosystem/check_crawl.sh dynamic_metadata_update.csv \
          'tstamp,repository_name,url,forks_count,total_releases,latest_release,release_date,stars,open_issues,contributors_count,discussions' \
          ../extensions-history

        # Name the archive after the crawl's own timestamp, not the run date
        STAMP=$(qsv sqlp dynamic_metadata_update.csv "SELECT MIN(tstamp) FROM _t_1" | qsv behead | cut -c1-10)
        mkdir -p ../extensions-history
        # qsv input rather than cp: re-serialising normalises line endings so
        # every archived file stacks identically.
        qsv input dynamic_metadata_update.csv > "../extensions-history/$STAMP.csv"
        echo "✓ Archived crawl as extensions-history/$STAMP.csv"

    - name: Step 6 - Build derived CSVs
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: |
        echo "=== STEP 6: Building derived CSVs ==="
        cd extensions-workflow

        mkdir -p derived
        ./derive_ext_csvs.sh snapshot dynamic_metadata_update.csv derived

        # Weekly mode needs two or more crawls
        CRAWLS=$(ls -1 ../extensions-history/*.csv | wc -l | tr -d " ")
        if [ "$CRAWLS" -ge 2 ]; then
          qsv cat rows ../extensions-history/*.csv > "$RUNNER_TEMP/ext_history.csv"
          ./derive_ext_csvs.sh weekly "$RUNNER_TEMP/ext_history.csv" derived
        else
          echo "Only $CRAWLS crawl archived, skipping weekly mode"
        fi

        ls -la derived

    - name: Step 7 - Upload derived CSVs to CKAN
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: |
        echo "=== STEP 7: Uploading derived CSVs as CKAN resources ==="
        cd extensions-workflow
        python upload_ext_derived.py derived

    - name: Step 8 - Commit archived crawl
      if: ${{ !cancelled() }}
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: 'chore: archive weekly CKAN extensions crawl [automated]'
        file_pattern: 'extensions-history/*.csv extensions-activity/*.csv'

#    - name: Step 5 - Create Table View for Extensions Resource
#      run: |
#        echo "=== STEP 5: Creating table view for extensions resource ==="
#        cd extensions-workflow
#        python 5createView.py
#        echo "✓ Table view creation completed"
    
    - name: Upload artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: extensions-debug-files
        path: |
          extensions-workflow/*.csv
          extensions-workflow/*.log
          extensions-workflow/derived/*.csv
        retention-days: 7
    
    - name: Upload generated CSVs as artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: extensions-metadata-csv-files
        path: |
          extensions-workflow/dynamic_metadata_update.csv
          extensions-workflow/existing_metadata.csv
          extensions-workflow/github_activity.csv
          extensions-workflow/entry_points.csv
          extensions-workflow/derived/*.csv
        retention-days: 30
    
    - name: Workflow Summary
      if: always()
      run: |
        echo "=== WORKFLOW SUMMARY ==="
        echo "Status: ${{ job.status }}"
        echo "Timestamp: $(date -u)"
        
        # Show file sizes if they exist
        cd extensions-workflow
        for file in url_list.csv dynamic_metadata_update.csv existing_metadata.csv; do
          if [ -f "$file" ]; then
            echo "$file: $(wc -l < "$file") lines, $(du -h "$file" | cut -f1)"
          fi
        done
        
        # Show any log files
        if ls *.log >/dev/null 2>&1; then
          echo "Log files created:"
          ls -la *.log
        fi
