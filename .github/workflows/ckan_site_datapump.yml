name: Datapump CKAN Sites Timeseries Metadata
on:
  schedule:
    # Runs every Sunday at 3:00 AM UTC (1 hour after extensions workflow)
    - cron: '0 3 * * 0'
  workflow_dispatch:
    # Allows manual triggering from GitHub UI

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GH_METADATA_TOKEN }}
  CKAN_API_KEY: ${{ secrets.CKAN_API_KEY }}
  CF_BYPASS_TOKEN: ${{ secrets.CF_BYPASS_TOKEN }}
  BATCH_SIZE: 500

jobs:
  # Step 1 + batch plan. Step 2 is split into BATCH_SIZE-site batches because a
  # single job crawling every site ran ~1h50m and hit the 120 minute job limit
  # before step 3 could finish.
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      batches: ${{ steps.plan.outputs.batches }}

    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-sites

    - name: Step 1 - Extract Sites URLs from CKAN
      run: |
        echo "=== STEP 1: Extracting Sites URLs from CKAN ==="
        cd sites-workflow
        python 1getSitesURL.py
        echo "✓ Sites URL extraction completed"

        # A degraded discovery step is what produced the 8-row, name-less
        # 2026-09-06 crawl. Checking the file merely exists let that through,
        # so check its shape and compare its size against the last real crawl.
        ../ecosystem/check_crawl.sh site_urls.csv 'name,url' ../sites-history

    - name: Plan batches
      id: plan
      run: |
        ROWS=$(qsv count sites-workflow/site_urls.csv)
        BATCHES=$(jq -nc --argjson n "$ROWS" --argjson s "$BATCH_SIZE" '[range(0; (($n + $s - 1) / $s | floor))]')
        echo "✓ $ROWS sites in batches of $BATCH_SIZE: $BATCHES"
        echo "batches=$BATCHES" >> "$GITHUB_OUTPUT"

    - uses: actions/upload-artifact@v4
      with:
        name: site-urls
        path: sites-workflow/site_urls.csv
        retention-days: 1

  fetch:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJSON(needs.discover.outputs.batches) }}

    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-sites

    - uses: actions/download-artifact@v4
      with:
        name: site-urls
        path: sites-workflow

    - name: Step 2 - Fetch Sites Data via CKAN Action API (batch ${{ matrix.batch }})
      run: |
        echo "=== STEP 2: Fetching batch ${{ matrix.batch }} via CKAN Action API ==="
        cd sites-workflow
        qsv slice --start $(( ${{ matrix.batch }} * BATCH_SIZE )) --len "$BATCH_SIZE" site_urls.csv -o batch.csv
        mv batch.csv site_urls.csv
        python 2CKANActionAPI.py
        echo "✓ Batch ${{ matrix.batch }} extraction completed"

        # Shape only: the size-vs-history floor is checked on the merged crawl.
        ../ecosystem/check_crawl.sh ckan_stats.csv \
          'tstamp,name,url,num_datasets,num_groups,num_organizations,ckan_version,extensions'

    - uses: actions/upload-artifact@v4
      with:
        name: sites-batch-${{ matrix.batch }}
        path: |
          sites-workflow/ckan_stats.csv
          sites-workflow/site_activity.csv
        retention-days: 1

  update-sites-metadata:
    needs: [discover, fetch]
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-sites

    - uses: actions/download-artifact@v4
      with:
        name: site-urls
        path: sites-workflow

    - uses: actions/download-artifact@v4
      with:
        pattern: sites-batch-*
        path: batches

    - name: Merge batches
      run: |
        echo "=== Merging fetch batches ==="
        cd sites-workflow
        qsv cat rows ../batches/sites-batch-*/ckan_stats.csv -o ckan_stats.csv
        qsv cat rows ../batches/sites-batch-*/site_activity.csv -o site_activity.csv
        echo "✓ Sites data extraction completed"

        ../ecosystem/check_crawl.sh ckan_stats.csv \
          'tstamp,name,url,num_datasets,num_groups,num_organizations,ckan_version,extensions' \
          ../sites-history

    - name: Step 3 - Update CKAN Sites Catalog
      continue-on-error: true
      run: |
        echo "=== STEP 3: Updating CKAN sites catalog ==="
        cd sites-workflow
        python 3updateSitesCatalog.py
        echo "✓ CKAN sites catalog update completed"

    - name: Step 4 - Append Time-Series Data to CKAN
      run: |
        echo "=== STEP 4: Appending time-series data to CKAN ==="
        cd sites-workflow

        # Guard: ensure the stats CSV has data before appending
        if [ ! -f "ckan_stats.csv" ]; then
          echo "✗ ckan_stats.csv not found, skipping append"
          exit 1
        fi
        ROW_COUNT=$(wc -l < ckan_stats.csv)
        if [ "$ROW_COUNT" -lt 2 ]; then
          echo "✗ ckan_stats.csv has no data rows (only $ROW_COUNT lines), skipping append"
          exit 1
        fi
        echo "✓ CSV validated: $ROW_COUNT lines"

        python datapump.py ckan_stats.csv
        echo "✓ Time-series data append completed"

    # Deliberately NOT continue-on-error. A bad archive is worse than a missing
    # one: qsv cat rows stacks the history positionally, so one file with the
    # wrong columns does not degrade the weekly build, it kills it. That is what
    # sites-history/2026-09-06.csv did, and because the old combined step
    # swallowed its own failure, the weekly resources on the catalog went stale
    # for two crawls with nothing reported.
    - name: Step 5 - Archive crawl
      if: ${{ !cancelled() }}
      run: |
        echo "=== STEP 5: Archiving crawl ==="
        cd sites-workflow

        ../ecosystem/check_crawl.sh ckan_stats.csv \
          'tstamp,name,url,num_datasets,num_groups,num_organizations,ckan_version,extensions' \
          ../sites-history

        # Name the archive after the crawl's own timestamp, not the run date
        STAMP=$(qsv sqlp ckan_stats.csv "SELECT MIN(tstamp) FROM _t_1" | qsv behead | cut -c1-10)
        mkdir -p ../sites-history
        # qsv input rather than cp: it re-serializes, so a CRLF dump (the
        # crawler started emitting them on 2026-08-30) is normalised on the way
        # into the archive and every file stacks identically.
        qsv input ckan_stats.csv > "../sites-history/$STAMP.csv"
        echo "✓ Archived crawl as sites-history/$STAMP.csv"

    - name: Step 6 - Build derived CSVs
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: |
        echo "=== STEP 6: Building derived CSVs ==="
        cd sites-workflow

        mkdir -p derived
        ./derive_csvs.sh snapshot ckan_stats.csv derived

        # Weekly mode needs two or more crawls
        CRAWLS=$(ls -1 ../sites-history/*.csv | wc -l | tr -d " ")
        if [ "$CRAWLS" -ge 2 ]; then
          qsv cat rows ../sites-history/*.csv > "$RUNNER_TEMP/history.csv"
          ./derive_csvs.sh weekly "$RUNNER_TEMP/history.csv" derived
        else
          echo "Only $CRAWLS crawl archived, skipping weekly mode"
        fi

        ls -la derived

    - name: Step 7 - Upload derived CSVs to CKAN
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: |
        echo "=== STEP 7: Uploading derived CSVs as CKAN resources ==="
        cd sites-workflow
        python upload_derived.py derived

    - name: Step 8 - Patch extension install counts
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: |
        echo "=== STEP 8: Patching instances_count on extension packages ==="
        cd sites-workflow
        python patch_instance_counts.py derived

    - name: Step 9 - Rebase on remote main
      if: ${{ !cancelled() }}
      run: git pull --rebase --autostash origin main

    - name: Step 9 - Commit archived crawl
      if: ${{ !cancelled() }}
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: 'chore: archive weekly CKAN sites crawl [automated]'
        file_pattern: 'sites-history/*.csv'

    - name: Upload artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: sites-debug-files
        path: |
          sites-workflow/*.csv
          sites-workflow/*.log
          sites-workflow/derived/*.csv
        retention-days: 7

    - name: Upload generated Sites CSVs as artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: sites-metadata-csv-files
        path: |
          sites-workflow/site_urls.csv
          sites-workflow/ckan_stats.csv
          sites-workflow/dynamic_metadata_update.csv
          sites-workflow/existing_sites_metadata.csv
          sites-workflow/derived/*.csv
        retention-days: 30

    - name: Workflow Summary
      if: always()
      run: |
        echo "=== SITES WORKFLOW SUMMARY ==="
        echo "Status: ${{ job.status }}"
        echo "Timestamp: $(date -u)"

        # Show file sizes if they exist
        cd sites-workflow
        for file in site_urls.csv ckan_stats.csv dynamic_metadata_update.csv existing_sites_metadata.csv; do
          if [ -f "$file" ]; then
            echo "$file: $(wc -l < "$file") lines, $(du -h "$file" | cut -f1)"
          fi
        done

        # Show derived CSVs if the build ran
        if [ -d derived ]; then
          echo "Derived CSVs:"
          for file in derived/*.csv; do
            [ -f "$file" ] && echo "$file: $(wc -l < "$file") lines, $(du -h "$file" | cut -f1)"
          done
        fi

        # Show any log files
        if ls *.log >/dev/null 2>&1; then
          echo "Log files created:"
          ls -la *.log
        fi
