name: Set up sites pipeline
description: Python, pip dependencies and qsv for the sites datapump jobs

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r sites-workflow/requirements.txt

    - name: Install qsv
      shell: bash
      run: |
        QSV_VERSION=22.0.1
        for attempt in 1 2 3 4 5; do
          curl -fsSLo "$RUNNER_TEMP/qsv.zip" \
            "https://github.com/dathere/qsv/releases/download/$QSV_VERSION/qsv-$QSV_VERSION-x86_64-unknown-linux-gnu.zip" \
            && unzip -tq "$RUNNER_TEMP/qsv.zip" && break
          [ "$attempt" = 5 ] && exit 1
          echo "qsv download failed (attempt $attempt), retrying"
          sleep $((attempt * 15))
        done
        unzip -q -o "$RUNNER_TEMP/qsv.zip" -d "$RUNNER_TEMP/qsv"
        sudo install "$RUNNER_TEMP/qsv/qsv" /usr/local/bin/qsv
        qsv --version
